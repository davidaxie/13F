name: Refresh backtest snapshots

on:
  schedule:
    # 6 AM UTC every Monday — quarterly 13F filings make weekly cadence plenty
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON files back

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshots
        run: npx tsx scripts/generate-all-snapshots.ts
        env:
          NODE_ENV: production
          # SEC EDGAR requires a User-Agent identifying the requester
          # (https://www.sec.gov/os/accessing-edgar-data); without it the
          # runner's anonymous requests get throttled or blocked.
          EDGAR_USER_AGENT: "David Xie mrdxdavidxie@gmail.com"

      - name: Commit and push updated snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/backtest/*.json
          git diff --cached --quiet || git commit -m "chore: refresh backtest snapshots [skip ci]"
          git push
